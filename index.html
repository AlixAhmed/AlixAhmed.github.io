<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Khwaja Ali - Copywriter and Video Editor, Lahore</title>
  
  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="A_Ytn8dCUhRyEhfU6PiamuRiciG3avfKpTFBWeehIeM" />
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" />
</head>
<style>
:root{--bg:#15123a;--card:#1f1b52;--text:#f7f2ff;--muted:#b3adda;--accent:#ff6b4a;--line:#34306e};
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:var(--text);
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;line-height:1.55;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:12px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1100px;margin:0 auto;padding:0 24px}
nav b{font-family:'Syne',sans-serif;font-size:16px}
nav b span{color:var(--accent)}
nav .links{display:flex;gap:18px;font-size:14px;color:var(--muted)}
nav a{color:inherit;text-decoration:none}
nav a:hover{color:var(--text)}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px;border:2px solid transparent;cursor:pointer;transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn.fill{background:var(--accent);color:#1a0b08;border-color:var(--accent)}
.btn.sm{padding:10px 18px;font-size:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hero{padding:90px 0 80px;position:relative}
.hero h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(42px,9vw,112px);line-height:.98;letter-spacing:-.03em;margin:0 0 24px}
.hero p{font-size:20px;color:var(--muted);max-width:30em;margin:0 0 36px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.star{position:absolute;right:-50px;top:30px;width:360px;height:360px;pointer-events:none;z-index:-1}
.star i{position:absolute;left:50%;top:50%;width:64px;height:100%;background:var(--accent);border-radius:3px;opacity:.2}
</style>
<body>
  <div class="wrap">
    <nav>
      <b>Khwaja Ali<span>.</span></b>
      <div class="links">
        <a href="#services">Services</a>
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
    <section class="hero">
      <h1>Short copy and simple video edits</h1>
      <p>Professional copywriting and video editing services in Lahore, designed to elevate your brand presence.</p>
      <div class="row">
        <a class="btn fill" href="#contact">Get in Touch</a>
      </div>
    </section>
  </div>
</body>
</html>
